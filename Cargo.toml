[package]
name = "polymur-hash"
version = "0.2.3"
edition = "2021"
authors = ["Frank Denis <github@pureftpd.org>"]
description = "PolymurHash non-cryptographic 64-bit universal hash function with seeded hashing, Hasher support, and no_std compatibility"
keywords = ["hash", "hashing", "polymur", "hasher", "no-std"]
license = "MIT"
homepage = "https://github.com/jedisct1/rust-polymur-hash"
repository = "https://github.com/jedisct1/rust-polymur-hash"
readme = "README.md"
categories = ["no-std", "algorithms"]

[[bench]]
name = "benchmark"
harness = false

[dependencies]

[dev-dependencies]
benchmark-simple = "0.1.11"
fnv = "1.0.7"
fxhash = "0.2.1"
xxhash-rust = { version = "0.8.18", features = ["xxh3"] }
komihash = "0.4.1"

[profile.release]
codegen-units = 1
incremental = false
panic = "abort"

[profile.dev]
overflow-checks = true
